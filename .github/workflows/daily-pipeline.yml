# Runs the news -> Gemini -> Supabase pipeline once a day, on GitHub's servers.
# Nothing is installed on your computer, and your PC does not need to be on.
name: Daily pipeline

on:
  schedule:
    # Times are UTC. 06:17 UTC = 11:47 AM IST.
    # Not on the hour on purpose: GitHub delays jobs that start at :00,
    # because that is when everyone else's jobs start too.
    - cron: "17 6 * * *"
  workflow_dispatch:      # adds a "Run workflow" button for manual runs

# Stop a run that hangs instead of letting it use up free minutes.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # a normal run takes 1-3 minutes

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the two packages the pipeline needs
        run: python -m pip install -r requirements.txt

      - name: Run the pipeline
        # The keys are stored in GitHub -> Settings -> Secrets, never in the code.
        # GitHub hides them in the logs if they ever get printed by accident.
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # The pipeline exits with code 1 when a run fails, which marks this
        # step red so the failure is visible (and GitHub emails you).
        run: python -m pipeline.run_pipeline
